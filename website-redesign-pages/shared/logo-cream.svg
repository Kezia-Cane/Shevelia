<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <title>Shevelia wordmark — cream reverse</title>
  <desc>Shevelia brand logo in serif typeface, cream for dark backgrounds</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&amp;display=swap');
    .wordmark {
      font-family: 'Playfair Display', 'EB Garamond', 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      font-weight: 500;
      font-size: 120px;
      letter-spacing: 0.005em;
      fill: #FCF9F4;
    }
  </style>
  <text x="300" y="115" text-anchor="middle" class="wordmark">Shevelia</text>
</svg>
